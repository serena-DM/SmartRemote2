apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * Configuration de React Native
 */
react {
    /* Identique à la config par défaut */
}

/**
 * Configuration Android
 */
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion 34 // Forcé à 34

    namespace "com.smartremote"
    defaultConfig {
        applicationId "com.smartremote"
        minSdkVersion 23    // Forcé à 23
        targetSdkVersion 34 // Forcé à 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Les dépendances standard de React Native
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Cette ligne est cruciale pour l'autolinking (erreur autolinking.json)
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)